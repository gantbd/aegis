[package]
name = "aegis-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Private Unix service application for Aegis"
publish = false

[[bin]]
name = "aegis-daemon"
path = "src/main.rs"
doc = false

[dependencies]
aegis-authority = { path = "../..", version = "=0.0.1" }
aegis-local = { path = "../../adapters/aegis-local", version = "=0.0.1" }
aegis-local-daemon = { path = "../../crates/aegis-local-daemon", version = "=0.1.0" }
aegis-service = { path = "../../crates/aegis-service", version = "=0.1.0" }
aegis-unix-peer = { path = "../../adapters/aegis-unix-peer", version = "=0.1.0" }
aegis-wire = { path = "../../crates/aegis-wire", version = "=0.1.0" }
keystone-storage = { path = "../../../keystone/crates/keystone-storage", version = "=0.0.1" }
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }

[dev-dependencies]
aegis-client = { path = "../../crates/aegis-client", version = "=0.1.0" }
aegis-protocol = { path = "../../crates/aegis-protocol", version = "=0.1.0" }
nix = { version = "=0.29.0", default-features = false, features = ["signal", "user"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
