[package]
name = "aegis-witness"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Fail-closed external rollback witness adapter for Aegis checkpoints"

[dependencies]
keystone-storage = { path = "../../../keystone/crates/keystone-storage", version = "=0.0.1" }

[dev-dependencies]
aegis-authority = { path = "../..", version = "=0.0.1" }
aegis-host = { path = "../../host/aegis-host", version = "=0.0.1" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
