[package]
name = "aegis-authority"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "A bounded authority engine for principals, delegation, and revocation"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[workspace]
members = [
  ".",
  "applications/aegis-admin-session",
  "applications/aegis-daemon",
  "host/aegis-host",
  "adapters/aegis-local",
  "adapters/aegis-unix-peer",
  "adapters/aegis-witness",
  "crates/aegis-client",
  "crates/aegis-admin-command",
  "crates/aegis-conformance",
  "crates/aegis-local-daemon",
  "crates/aegis-local-client",
  "crates/aegis-protocol",
  "crates/aegis-service",
  "crates/aegis-wire",
  "sdk/embedded",
]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

