[package]
name = "aegis-sdk-embedded"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Zero-authority embedded SDK facade for Aegis"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aegis-authority = { path = "../..", version = "=0.0.1" }
aegis-host = { path = "../../host/aegis-host", version = "=0.0.1" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
