[package]
name = "aegis-local-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Public private-Unix client for the Aegis service protocol"
publish = false

[dependencies]
aegis-client = { path = "../aegis-client", version = "=0.1.0" }
aegis-protocol = { path = "../aegis-protocol", version = "=0.1.0" }
aegis-wire = { path = "../aegis-wire", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
