[package]
name = "aegis-admin-command"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Exact-confirmation guards for Aegis administrative commands"

[dependencies]
aegis-client = { version = "=0.1.0", path = "../aegis-client" }
aegis-protocol = { version = "=0.1.0", path = "../aegis-protocol" }

[dev-dependencies]
aegis-authority = { version = "=0.0.1", path = "../.." }
aegis-host = { version = "=0.0.1", path = "../../host/aegis-host" }
aegis-service = { version = "=0.1.0", path = "../aegis-service" }
keystone-storage = { version = "=0.0.1", path = "../../../keystone/crates/keystone-storage" }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
